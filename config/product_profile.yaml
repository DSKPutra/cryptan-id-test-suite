# ============================================================================
# Cryptan.ID Test Suite — Profil Produk (input bersama UK-1 s.d. UK-8)
# KUK 1.1: informasi desain & teknik implementasi produk kriptografi.
# SELURUH DATA DI SINI ILUSTRATIF (bukan desain produk rahasia) — sikap kerja.
# ============================================================================
product:
  name: "Cryptan.ID SecureLib"
  version: "1.0.0 (hipotetis)"
  description: "Library kriptografi perangkat lunak (shared object) untuk Linux x86-64"
  vendor: "Vendor ilustratif"
  classification: "DATA ILUSTRATIF — bukan desain produk rahasia"

implementation:
  platform: linux-x86_64-library
  platform_desc: "Shared library (.so) di Linux x86-64; CPU multi-core dengan cache L3 bersama"
  language: C
  bindings: [Python]
  interfaces: ["C API (libsecure.so)", "Python binding (ctypes)"]
  rng: "getrandom(2) → HMAC_DRBG (SP 800-90A)"
  self_tests: true
  hardware_acceleration: false

tester:
  access: grey_box          # white_box | grey_box | black_box
  access_desc: >-
    Penguji memperoleh spesifikasi algoritma & dokumen desain tingkat tinggi,
    biner library + header API, dan lingkungan uji dengan kunci uji.
    Kode sumber TIDAK tersedia.
  scope:
    - "Kesesuaian implementasi algoritma terhadap standar (KAT/MCT)"
    - "Kekuatan algoritma (komponen, ronde tereduksi, keacakan keluaran)"
    - "Implementasi pada platform: timing/cache, validasi masukan, RNG, self-test"
  out_of_scope:
    - "Serangan invasif fisik (decapsulation, probing)"
    - "Keamanan sistem operasi host di luar library"

resources:
  personnel:
    - {role: "Cryptographic Analyst", count: 2, skills: ["kriptanalisis", "statistik", "Python"]}
    - {role: "Test engineer", count: 1, skills: ["otomasi uji", "fuzzing", "Linux"]}
  schedule_days: 10
  hours_per_day: 8
  method_budget_hours: 24        # batas waktu komputasi maksimum per metode
  compute: {machines: 1, cores: 8, ram_gb: 16}
  speedup_factor: 1              # faktor implementasi optimasi vs referensi Python (1 = konservatif)
  tools_available: [python, pytest, gdb]

algorithms_under_test: ../outputs/algo_catalog/algorithms_under_test.yaml   # dihasilkan algo_catalog (KUK 1.1)

# ---------------------------------------------------------------------------
# UK-2 — informasi tambahan untuk penyusunan & verifikasi skenario (ILUSTRATIF)
# ---------------------------------------------------------------------------
uk2:
  product_type: library            # library | application | token | hsm | gateway
  testing_model: 3                 # 3 = Komponen–Integrasi–Sistem; 4 = Unit–Integration–System–UAT (modul ISO/IEC 19790)
  iso19790_security_level: null    # null = tidak berlaku (bukan modul tervalidasi)
  # Fitur produk — skenario yang membutuhkan fitur di luar daftar ini DITOLAK verifier (aturan f)
  features: [api, software_library, keygen, key_import_export, streaming_api, self_tests, error_codes,
             rng_internal, aead, signature, kem, timing_measurement, fuzzing_harness, multi_thread]
  # Klaim keamanan produk — setiap klaim wajib punya ≥ 1 skenario Uji Keamanan (aturan c)
  claims:
    - {id: C-STRENGTH, claim: "Tingkat keamanan ≥ 112 bit untuk seluruh algoritma approved (SP 800-57)", tags: [bit_security]}
    - {id: C-AEAD, claim: "AEAD (AES-GCM, ChaCha20-Poly1305): kerahasiaan IND-CPA + integritas INT-CTXT bila nonce unik", tags: [aead, nonce_misuse]}
    - {id: C-PKE, claim: "RSA-OAEP: IND-CCA2; galat dekripsi seragam (tanpa oracle)", tags: [ind_cca2, oracle]}
    - {id: C-SIG, claim: "ECDSA/EdDSA/ML-DSA: EUF-CMA; nonce tidak berulang/bias", tags: [euf_cma, nonce_bias]}
    - {id: C-HASH, claim: "SHA3-256/SHA-2: collision 2^(n/2), preimage 2^n", tags: [collision, preimage]}
    - {id: C-CT, claim: "Operasi dengan data rahasia berjalan constant-time pada x86-64", tags: [constant_time]}
    - {id: C-RNG, claim: "Kunci & nonce dari HMAC_DRBG/CTR_DRBG (SP 800-90A) dengan entropi memadai", tags: [rng]}
  limits:                          # batas penggunaan yang diklaim (dipakai skenario Sistem)
    max_message_bytes: 1073741824
    rekey_after_messages: 4294967296

# Profil algoritma objek praktikum (satu per kelas primitif) — "All"
algorithms:
  - profiles/aes128.yaml
  - profiles/chacha20.yaml
  - profiles/sha3_256.yaml
  - profiles/rsa_oaep_2048.yaml
  - profiles/ecdsa_p256.yaml
