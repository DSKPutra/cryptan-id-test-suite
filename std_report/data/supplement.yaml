   quantum_vulnerable: true}
- {id: PHOTON, source_body: [ISO-IEC], source_doc: ["ISO/IEC 29192-5"], primitive: hash, family: PHOTON, variant: PHOTON, key_bits: [80, 128, 160, 224, 256],
