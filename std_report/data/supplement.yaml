   notes: "Lightweight hash; key_bits = panjang keluaran"}
- {id: LESAMNTA-LW, source_body: [ISO-IEC], source_doc: ["ISO/IEC 29192-5"], primitive: hash, family: Lesamnta-LW, variant: Lesamnta-LW,
   block_or_output_bits: 256, security_strength_bits: 120, status_nist: not_nist, standards: [ISO/IEC 29192-5], combo_id: "LESAMNTA-LW",
