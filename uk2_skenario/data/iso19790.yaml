framework_3x4:
  Unit Testing:
    desc: Fungsi/primitif dan unit firmware diuji terisolasi
    K: KAT algoritma, vektor DRBG, rutin self-test
    S: Entropi, zeroisation, kekuatan autentikasi
    I: SAST, fuzzing parser, TVLA per fungsi
  Integration Testing:
    desc: 'Unit dirangkai: API, manajer kunci, engine, key store, boot chain'
    K: Matriks peran–layanan, siklus SSP, indikator approved
    S: Penghambatan output, ekspor kunci, update firmware
    I: Reproducible build, fault pada boot, fuzzing API
  System Testing:
    desc: Modul utuh pada batas kriptografis, seluruh antarmuka
    K: Batas kriptografis, antarmuka, security policy
    S: Tamper, EFP/EFT, split knowledge
    I: Side-channel modul tertutup, lingkungan operasi, pengiriman
  UAT:
    desc: Modul di lingkungan dan kasus penggunaan nyata pengguna
    K: Key ceremony, integrasi aplikasi, kepatuhan regulasi
    S: Dual control, respons insiden, pemulihan bencana
    I: Kinerja, ketersediaan, pemeliharaan lapangan
governance:
  Unit Testing:
    executor: Pengembang / tim verifikasi internal
    entry: Desain & kode unit dibekukan; vektor uji tersedia
    exit: Seluruh uji unit lulus; cakupan cabang ≥ target; tanpa temuan SAST tingkat tinggi
  Integration Testing:
    executor: Tim verifikasi internal
    entry: Uji unit lulus; antarmuka antar-unit terdokumentasi
    exit: Alur layanan, peran, dan SSP sesuai rancangan security policy
  System Testing:
    executor: Laboratorium uji terakreditasi (ISO/IEC 17025)
    entry: Security policy final; bukti vendor sesuai ISO/IEC 24759
    exit: Seluruh asersi uji terpenuhi pada tingkat keamanan yang ditargetkan
  UAT:
    executor: Pengguna / pemilik proses bisnis bersama penguji
    entry: Laporan uji sistem tersedia; lingkungan operasional siap
    exit: Kriteria penerimaan pengguna terpenuhi; berita acara penerimaan
standards:
- ISO/IEC 19790:2012
- ISO/IEC 24759:2017
- ISO/IEC 18367
- ISO/IEC 17825
