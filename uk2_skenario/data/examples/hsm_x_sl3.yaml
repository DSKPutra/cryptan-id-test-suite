outcome_map:
- condition: Output data keluar saat self-test gagal
  trigger: Status modul
  outcome: Tidak Memenuhi
  action: Temuan kritis area 7.3/7.10; perbaiki state machine, ulangi I-K-04 dan I-S-01
- condition: Min-entropi di bawah klaim pada suhu batas operasi
  trigger: Kondisi entropi
  outcome: Memenuhi dengan Catatan
  action: Diterima bila rentang suhu operasi dipersempit dalam security policy; jika tidak, tidak memenuhi
- condition: TVLA |t| ≥ 4,5 pada signing ECDSA melalui API
  trigger: Kuantitas trace
  outcome: Tidak Memenuhi
  action: Konfirmasi eksploitabilitas dengan CPA; terapkan countermeasure
- condition: Hasil TVLA tidak konsisten antarsesi pengukuran
  trigger: Kuantitas trace
  outcome: Inkonklusif
  action: Perbesar jumlah trace dan kendalikan derau pengukuran
- condition: Firmware versi lama diterima (rollback)
  trigger: Image firmware
  outcome: Tidak Memenuhi
  action: Terapkan penghitung versi anti-rollback
- condition: Kunci dapat diimpor tanpa kuorum kustodian
  trigger: Metode entri SSP
  outcome: Tidak Memenuhi
  action: Wajibkan split knowledge pada seluruh jalur impor
- condition: Seluruh uji sistem lulus, kinerja di bawah SLA
  trigger: Beban produksi
  outcome: Memenuhi dengan Catatan
  action: 'Penerimaan bersyarat: tambah kapasitas atau revisi SLA'
